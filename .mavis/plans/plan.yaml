      - 4× TS6133 (unused): `entities/Boss.ts:1` (THREE), `entities/Player.ts:3` (INVINCIBILITY_DURATION), `LevelManager.ts:17` (waveIndex), `systems/CombatSystem.ts:5` (phys) — remove the unused imports.

      After these, `npm run build` and `npm run lint` must both pass with 0 errors.

      ### Fix 2 — Replace the flat background slab
      The parallax background planes are solid `MeshStandardMaterial` with `emissive=color` and no surface variation. The user's reference shot shows a "diagonal dark grey slab"; the WIP screenshot shows a "massive solid forest-green wall." The background is the biggest visual issue.

      **Approach** (pick the simplest that looks good):
      - **Option A (preferred)**: replace each parallax plane with a procedurally-textured plane — gradient sky → silhouette via canvas-generated texture. So the back wall reads as a layered sky/scene, not a flat slab.
      - **Option B**: replace with a skydome (sphere with vertical gradient texture) behind everything.

      Do NOT just change the color — that doesn't fix the "flat" problem. The slab must have visible surface variation.

      ### Fix 3 — Make the floor read as grass, not charcoal
      The procedural grass texture is wired into `Environment.createFloor()` but the screenshot shows the floor as black/charcoal.

      **Diagnose first**:
      - Confirm in code that the texture is being assigned to the material's `map` (not just `color` or another property) at runtime
      - If texture is assigned correctly: lighting is the issue → check ambient/directional intensities, exposure, tone mapping. The floor must be visibly green/grass-textured, not pure black.
      - If texture is NOT assigned correctly: fix the wiring.

      Fix the right thing so the floor visibly shows green/grass texture in the screenshot.

      ### Fix 4 — Make bloom and shadows actually visible
      - **Bloom**: `UnrealBloomPass` is wired but `threshold: 0.8` is too high for this scene. Lower threshold to ~0.4, raise strength to ~0.6. Add at least one emissive element (light, decal, or material) that will trigger bloom.
      - **Shadows**: `PCFShadowMap` enabled with 1024² mapSize and `shadow.bias = -0.001`. Shadows aren't visible in the screenshot. Try `PCFSoftShadowMap`, bump mapSize to 2048, set bias to `-0.0005` or remove it. Verify shadows visibly fall on the floor from player or trees.

