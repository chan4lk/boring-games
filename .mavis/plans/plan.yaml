      ### Fix 1 — Unblock the build
      Current state: `npm run build` (= `tsc -b && vite build`) FAILS with 14 errors total.

      **4 NEW errors from this WIP** — `src/contra-3d/rendering/PostProcessingManager.ts:1-4`: TS2307 cannot find module `three/addons/postprocessing/{EffectComposer,RenderPass,UnrealBloomPass,OutputPass}`. Root cause: `three@0.183.2` ships addons as `.js` only (no `.d.ts`). Vite resolves them at runtime, but `tsc` with `moduleResolution: bundler` + `noUncheckedSideEffectImports` rejects the imports.
      - **Fix**: add `src/three-addons.d.ts` that re-exports the four modules from their actual paths under `three/examples/jsm/postprocessing/`. Verify with `tsc -b` that the errors clear. Keep the shim minimal — only the 4 modules actually used.

